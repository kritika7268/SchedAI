services:
  # Backend – FastAPI
    - type: web
    name: schedai-backend
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    autoDeploy: true

    envVars:
      - key: MYSQL_HOST
        sync: false

      - key: MYSQL_PORT
        sync: false

      - key: MYSQL_USER
        sync: false

      - key: MYSQL_PASSWORD
        sync: false

      - key: MYSQL_DATABASE
        sync: false

      - key: JWT_SECRET_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: BACKEND_URL
        sync: false

      - key: RESET_OTP_SECRET
        sync: false
      - key: ADMIN_SIGNUP_CODE
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7

  # Frontend – React/Vite
  - type: web
    name: schedai-frontend
    runtime: static
    plan: starter

    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true

    envVars:
      - key: VITE_API_URL
        sync: false

        routes:
      - type: rewrite
        source: /*
        destination: /index.html  