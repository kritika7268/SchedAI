services:
  # Backend – FastAPI
  - type: web
    name: schedai-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true

    envVars:
      - key: MYSQL_HOST
        sync: false

      - key: MYSQL_PORT
        sync: false

      - key: MYSQL_USER
        sync: false

      - key: MYSQL_PASSWORD
        sync: false

      - key: MYSQL_DATABASE
        sync: false

      - key: JWT_SECRET_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: BACKEND_URL
        sync: false

  # Frontend – React/Vite
  - type: web
    name: schedai-frontend
    runtime: static
    plan: starter

    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true

    envVars:
      - key: VITE_API_URL
        sync: false