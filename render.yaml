services:
  # Backend – FastAPI (Web Service)
  - type: web
    name: schedai-backend
    env: python
    plan: starter
    region: oregon
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: MYSQL_HOST
        fromSecret: MYSQL_HOST
      - key: MYSQL_PORT
        fromSecret: MYSQL_PORT
      - key: MYSQL_USER
        fromSecret: MYSQL_USER
      - key: MYSQL_PASSWORD
        fromSecret: MYSQL_PASSWORD
      - key: MYSQL_DATABASE
        fromSecret: MYSQL_DATABASE
      - key: JWT_SECRET_KEY
        fromSecret: JWT_SECRET_KEY
      - key: GEMINI_API_KEY
        fromSecret: GEMINI_API_KEY
      - key: FRONTEND_URL
        fromSecret: FRONTEND_URL
      - key: BACKEND_URL
        fromSecret: BACKEND_URL

  # Frontend – React/Vite (Static Site)
  - type: static
    name: schedai-frontend
    env: static
    plan: starter
    region: oregon
    buildCommand: |
      cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromSecret: BACKEND_URL
